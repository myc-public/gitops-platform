# Observabilite en mode pile (EDA7) : memes fichiers que le deploiement (apps/observability/base), Grafana sur la
# boucle locale uniquement. Compte administrateur : GRAFANA_ADMIN_USER et GRAFANA_ADMIN_PASSWORD de .env.
services:
  otel-lgtm:
    image: docker.io/grafana/otel-lgtm:0.34.0@sha256:b966ea107831d526d9eb8fe4d2d86c9e5731392fad9dce8296bcf2072031f07c
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER absent}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD absent}
      OTELCOL_EXTRA_ARGS: --config=file:/otel-lgtm/kafka-connect-scrape.yaml
    mem_limit: 2g
    ports:
      - "127.0.0.1:${PILE_GRAFANA_PORT:-3000}:3000"
    volumes:
      - otel-lgtm-data:/data
      - ../../apps/observability/base/grafana/dashboards-provider.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/socle-dashboards.yaml:ro
      - ../../apps/observability/base/grafana/alerting/donation-api-alerts.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/donation-api-alerts.yaml:ro
      - ../../apps/observability/base/otelcol/kafka-connect-scrape.yaml:/otel-lgtm/kafka-connect-scrape.yaml:ro
      - ../../apps/observability/base/grafana/dashboards:/otel-lgtm/socle-dashboards:ro
    networks: [telemetry]

volumes:
  otel-lgtm-data:

networks:
  telemetry:
    name: donation-pile-telemetry
