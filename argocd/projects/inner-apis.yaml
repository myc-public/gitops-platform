apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: inner-apis
  namespace: argocd
spec:
  description: APIs inner (donation, order, ...)
  sourceRepos:
    - https://github.com/myc-public/gitops-platform.git
  # Ajouter ici chaque namespace/cluster cible (un par environnement).
  # name = nom du Secret de cluster Argo CD (hors Git, porte l'URL d'API) : ici le Sandbox OpenShift.
  destinations:
    - name: sandbox-gregorie769-dev
      namespace: gregorie769-dev
  # Moindre privilege : aucune ressource cluster-scoped, uniquement ces types namespaced
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - { group: apps, kind: Deployment }
    - { group: "", kind: Service }
    - { group: "", kind: ConfigMap }
    - { group: "", kind: ServiceAccount }
    - { group: "", kind: PersistentVolumeClaim }
    - { group: route.openshift.io, kind: Route }
    - { group: autoscaling, kind: HorizontalPodAutoscaler }
