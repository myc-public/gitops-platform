# MODELE sans valeur secrete. Copier HORS du depot, remplacer les <...>, puis :
#   ocs apply -f <copie>.yaml
# Lu par le BFF web-bff-customers (envFrom) et par son Redis (web-bff-redis).
#   OIDC_CLIENT_SECRET = WEB_BFF_CLIENT_SECRET de keycloak-realm-secret (meme valeur, client web-bff du realm)
#   REDIS_PASSWORD     = mot de passe de l'utilisateur ACL web-bff-customers
apiVersion: v1
kind: Secret
metadata:
  name: web-bff-customers-secret
  namespace: gregorie769-dev
  labels:
    app.kubernetes.io/name: web-bff-customers
    app.kubernetes.io/part-of: web
type: Opaque
stringData:
  OIDC_CLIENT_SECRET: "<valeur de WEB_BFF_CLIENT_SECRET>"
  REDIS_PASSWORD: "<secret aleatoire>"
