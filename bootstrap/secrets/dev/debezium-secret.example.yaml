# MODELE sans valeur secrete. Copier HORS du depot, remplacer les <...>, puis :
#   ocs apply -f <copie>.yaml
# Meme mot de passe aux deux endroits : DEBEZIUM_DB_PASSWORD cree le compte MySQL, connect.properties est lu par Kafka Connect.
apiVersion: v1
kind: Secret
metadata:
  name: debezium-secret
  namespace: gregorie769-dev
  labels:
    app.kubernetes.io/name: kafka-connect
    app.kubernetes.io/part-of: events
type: Opaque
stringData:
  DEBEZIUM_DB_PASSWORD: "<mot de passe fort, lettres et chiffres>"
  connect.properties: |
    db.password=<meme mot de passe>
    es.password=<ES_SINK_PASSWORD de elasticsearch-secret>
