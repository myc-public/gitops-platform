# MODELE sans valeur secrete. Copier HORS du depot, remplacer les <...>, puis :
#   ocs apply -f <copie>.yaml
# Compte admin de demarrage (realm master) : lu par Keycloak et par le Job keycloak-config (import des realms).
# Keycloak ne cree ce compte qu'au 1er demarrage (base vide) : le changer ensuite se fait dans la console admin.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin-secret
  namespace: gregorie769-dev
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: identity
type: Opaque
stringData:
  KC_BOOTSTRAP_ADMIN_USERNAME: "<utilisateur, ex. admin>"
  KC_BOOTSTRAP_ADMIN_PASSWORD: "<mot de passe fort>"
