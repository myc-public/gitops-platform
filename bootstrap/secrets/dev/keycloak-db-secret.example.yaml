# MODELE sans valeur secrete. Copier HORS du depot, remplacer les <...>, puis :
#   ocs apply -f <copie>.yaml
# Lu par Keycloak (envFrom) et par PostgreSQL (POSTGRESQL_USER / POSTGRESQL_PASSWORD) : une seule source de verite.
# PostgreSQL ne cree l'utilisateur qu'au 1er demarrage (volume vide) : changer le mot de passe ensuite
# impose un ALTER USER dans PostgreSQL, pas seulement une mise a jour du Secret.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-secret
  namespace: gregorie769-dev
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: identity
type: Opaque
stringData:
  KC_DB_USERNAME: "<utilisateur, ex. keycloak>"
  KC_DB_PASSWORD: "<mot de passe fort>"
