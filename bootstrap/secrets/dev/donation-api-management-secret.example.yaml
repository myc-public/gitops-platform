# MODELE sans valeur secrete. Copier HORS du depot, remplacer les <...>, puis :
#   ocs apply -f <copie>.yaml
# Comptes basic auth des endpoints /management de l'API (envFrom) :
#   ADMIN = tous les endpoints (loggers, env...), VIEWER = metrics / prometheus.
# /management/health/** et /management/info restent publics (sondes Kubernetes, Route).
apiVersion: v1
kind: Secret
metadata:
  name: donation-api-management-secret
  namespace: gregorie769-dev
  labels:
    app.kubernetes.io/name: donation-api
    app.kubernetes.io/part-of: inner-apis
type: Opaque
stringData:
  MANAGEMENT_ADMIN_USER: "<utilisateur admin>"
  MANAGEMENT_ADMIN_PWD: "<mot de passe fort>"
  MANAGEMENT_VIEWER_USER: "<utilisateur viewer>"
  MANAGEMENT_VIEWER_PWD: "<mot de passe fort>"
