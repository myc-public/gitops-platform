# MODELE sans valeur secrete. Copier HORS du depot, remplacer les <...>, puis :
#   ocs apply -f <copie>.yaml
# Lu par l'API (envFrom) et par MySQL (MYSQL_USER / MYSQL_PASSWORD) : une seule source de verite.
# MySQL ne cree l'utilisateur qu'au 1er demarrage (datadir vide) : changer le mot de passe ensuite
# impose un ALTER USER dans MySQL, pas seulement une mise a jour du Secret.
apiVersion: v1
kind: Secret
metadata:
  name: donation-api-db-secret
  namespace: gregorie769-dev
  labels:
    app.kubernetes.io/name: donation-api
    app.kubernetes.io/part-of: inner-apis
type: Opaque
stringData:
  DB_USER: "<utilisateur applicatif, ex. donation>"
  DB_PASSWORD: "<mot de passe fort>"
