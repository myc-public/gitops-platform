# MODELE sans valeur secrete. Copier HORS du depot, remplacer les <...>, puis :
#   ocs apply -f <copie>.yaml
# Lu par le Job keycloak-config : valeurs substituees dans les fichiers des realms (apps/keycloak).
# Une modification est prise en compte au prochain import (prochaine synchronisation Argo CD).
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-realm-secret
  namespace: gregorie769-dev
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: identity
type: Opaque
stringData:
  DONATION_WEB_CLIENT_SECRET: "<secret aleatoire>"
  DONATION_BACKOFFICE_CLIENT_SECRET: "<secret aleatoire>"
  DONATION_SERVICE_CLIENT_SECRET: "<secret aleatoire>"
  DONATION_TESTS_CLIENT_SECRET: "<secret aleatoire>"
  # Utilisateurs de test (dev) : 14 caracteres minimum (politique du realm myc-internal)
  TEST_USERS_PASSWORD: "<mot de passe fort>"
