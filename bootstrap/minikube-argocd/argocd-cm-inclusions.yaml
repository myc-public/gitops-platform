
# Configuration Argo CD (minikube) : types de ressources surveilles par cluster.
# Le Sandbox refuse le list de nombreux types (roles, podtemplates, CRD OpenShift AI...) meme a son proprietaire :
# sans cette liste blanche, le cache Argo CD echoue et les Applications restent en "Unknown".
# Toute ressource non listee est ignoree => regle "tout" obligatoire pour minikube (in-cluster), sinon root casse.
# Applique en server-side apply avec un field manager dedie : seule la cle resource.inclusions est possedee,
# les autres cles d'argocd-cm (issues de l'installation) ne sont pas touchees :
#   kubectl --context minikube apply --server-side --field-manager=gitops-bootstrap -f bootstrap/minikube-argocd/argocd-cm-inclusions.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  resource.inclusions: |
    # minikube : Argo CD gere ses propres objets (AppProject, ApplicationSet...) sans restriction
    - apiGroups: ["*"]
      kinds: ["*"]
      clusters: ["https://kubernetes.default.svc"]
    # Cluster OpenShift cible (motif glob : toute API OpenShift, survit a un changement de cluster)
    # types geres (cf. AppProject inner-apis) + types lus pour la sante (Pod, ReplicaSet, Endpoints)
    - apiGroups: [""]
      kinds: [Service, ConfigMap, ServiceAccount, PersistentVolumeClaim, Pod, Endpoints]
      clusters: ["https://api.*:6443"]
    - apiGroups: [apps]
      kinds: [Deployment, ReplicaSet]
      clusters: ["https://api.*:6443"]
    - apiGroups: [route.openshift.io]
      kinds: [Route]
      clusters: ["https://api.*:6443"]
    - apiGroups: [autoscaling]
      kinds: [HorizontalPodAutoscaler]
      clusters: ["https://api.*:6443"]
