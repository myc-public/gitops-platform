#   kubectl --context minikube apply -f <copie>.yaml
# bearerToken / caData : issus du Secret argocd-deployer-token (namespace gregorie769-dev, Sandbox).
apiVersion: v1
kind: Secret
metadata:
  name: sandbox-gregorie769-dev
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
type: Opaque
stringData:
  name: sandbox-gregorie769-dev
  server: https://api.rm3.7wse.p1.openshiftapps.com:6443
  namespaces: gregorie769-dev
  config: |
    {
      "bearerToken": "<token argocd-deployer>",
      "tlsClientConfig": { "insecure": false, "caData": "<ca.crt en base64>" }
    }
