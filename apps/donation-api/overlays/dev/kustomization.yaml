apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gregorie769-dev
resources:
  - ../../base
# Profil propre a l'environnement : la base reste neutre, chaque overlay injecte le sien
patches:
  - target: { kind: ConfigMap, name: donation-api-config }
    patch: |-
      - op: add
        path: /data/SPRING_PROFILES_ACTIVE
        value: dev
      # Route OpenShift directe (pas de nginx devant) : pas de prefixe /api/donation/ pour Swagger
      - op: add
        path: /data/MYC_CONTEXT
        value: /
      # Observabilite : traces / metriques / logs en OTLP vers la stack otel-lgtm (apps/observability)
      - op: add
        path: /data/OTLP_ENDPOINT
        value: http://otel-lgtm:4318
      - op: add
        path: /data/OTLP_EXPORT_ENABLED
        value: "true"
      # Emetteurs de confiance (DI4) : iss = URL publique (APISIX externe, comme dans les tokens) ;
      # cles de signature lues en interne, sans passer par les passerelles (D5-2)
      - op: add
        path: /data/OIDC_INTERNAL_ISSUER_URI
        value: https://donation-gregorie769-dev.apps.rm3.7wse.p1.openshiftapps.com/realms/myc-internal
      - op: add
        path: /data/OIDC_INTERNAL_JWK_SET_URI
        value: http://keycloak:8080/realms/myc-internal/protocol/openid-connect/certs
      - op: add
        path: /data/OIDC_CUSTOMERS_ISSUER_URI
        value: https://donation-gregorie769-dev.apps.rm3.7wse.p1.openshiftapps.com/realms/myc-customers
      - op: add
        path: /data/OIDC_CUSTOMERS_JWK_SET_URI
        value: http://keycloak:8080/realms/myc-customers/protocol/openid-connect/certs
images:
  - name: donation-api
    newName: image-registry.openshift-image-registry.svc:5000/gregorie769-dev/donation-api
    # Ligne mise a jour automatiquement par Jenkins (stage "Update GitOps") : ne pas editer a la main
    newTag: 1.1.0-SNAPSHOT-1879da8-b6
