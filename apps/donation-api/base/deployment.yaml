apiVersion: apps/v1
kind: Deployment
metadata:
  name: donation-api
  labels:
    app.kubernetes.io/name: donation-api
    app.kubernetes.io/part-of: inner-apis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: donation-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: donation-api
    spec:
      containers:
        - name: donation-api
          # Nom logique : newName/newTag sont poses par l'overlay (images: dans kustomization.yaml)
          image: donation-api
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: donation-api-config
            # Secret cree hors Git (Sealed Secrets / External Secrets) : ne jamais commiter de secret ici
            - secretRef:
                name: donation-api-db-secret
            # Comptes basic auth des endpoints /management (MANAGEMENT_*), cree hors Git
            - secretRef:
                name: donation-api-management-secret
          # base-path Actuator = /management (application.yml). /management/health/** reste public
          # (SecurityManagementConfig), quelle que soit la valeur de myc.security.enabled.
          readinessProbe:
            httpGet: { path: /management/health/readiness, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /management/health/liveness, port: http }
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
