apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: donation-api-mysql-data
  labels:
    app.kubernetes.io/name: donation-api-mysql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: inner-apis
  annotations:
    # Vague -1 : la base est creee et doit etre Healthy avant l'API (vague 0)
    argocd.argoproj.io/sync-wave: "-1"
    # Jamais supprimee par Argo CD : les donnees survivent a une suppression/renommage de l'Application
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  # Pas de storageClassName : classe par defaut du cluster (gp3 sur le Sandbox) => manifeste portable
  resources:
    requests:
      storage: 5Gi
