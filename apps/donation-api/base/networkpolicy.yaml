# Isolation reseau (O2) : seuls les flux de la pile locale (reseaux Docker) sont autorises ; sortant non filtre.
# Sans effet sur le Sandbox OpenShift (politique imposee allow-same-namespace, dette 17) ; effectif sur un cluster maitrise.
# Les sondes du kubelet ne sont pas concernees.
# API : uniquement APISIX interne (plus d'acces direct depuis le routeur). MySQL : uniquement l'API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: donation-api
  labels:
    app.kubernetes.io/part-of: inner-apis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: donation-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: apisix-internal } }
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: donation-api-mysql
  labels:
    app.kubernetes.io/part-of: inner-apis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: donation-api-mysql
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: donation-api } }
      ports:
        - { protocol: TCP, port: 3306 }
