# Serveur SMTP de dev : capte les emails de Keycloak (verification, mot de passe oublie) sans les envoyer.
# Pas de Route ; consultation : ocs port-forward svc/mailpit 8025 puis http://localhost:8025
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/component: smtp-dev
    app.kubernetes.io/part-of: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
        app.kubernetes.io/component: smtp-dev
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d   # v1.31
          ports:
            - name: smtp
              containerPort: 1025
              protocol: TCP
            - name: http
              containerPort: 8025
              protocol: TCP
          readinessProbe:
            tcpSocket: { port: smtp }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/component: smtp-dev
    app.kubernetes.io/part-of: identity
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
      protocol: TCP
    - name: http
      port: 8025
      targetPort: http
      protocol: TCP
---
# Isolation reseau (O2, sans effet sur le Sandbox : dette 17) : SMTP uniquement depuis Keycloak ; interface web par port-forward.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/part-of: identity
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: keycloak } }
      ports:
        - { protocol: TCP, port: 1025 }
