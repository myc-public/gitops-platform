# Realm myc - applique par keycloak-config-cli (idempotent), local et OpenShift.
# Variables d'environnement substituees (syntaxe dollar-parenthese env:NOM) : secrets (keycloak-secret, hors Git)
# et valeurs d'environnement (ConfigMap de l'overlay). La substitution porte sur tout le texte, commentaires compris :
# ne jamais ecrire cette syntaxe dans un commentaire.
# Clients, roles et client scopes sont geres en entier par keycloak-config-cli : ne les definir QUE dans ce fichier.
realm: myc
enabled: true
displayName: MYC
sslRequired: external
registrationAllowed: false
loginWithEmailAllowed: true
duplicateEmailsAllowed: false
resetPasswordAllowed: true
# Protection contre le bourrage d'identifiants
bruteForceProtected: true
failureFactor: 5
waitIncrementSeconds: 60
maxFailureWaitSeconds: 900
passwordPolicy: "length(12) and notUsername and notEmail"
# Tokens courts, refresh token a usage unique (rotation)
accessTokenLifespan: 300
ssoSessionIdleTimeout: 1800
ssoSessionMaxLifespan: 36000
revokeRefreshToken: true
refreshTokenMaxReuse: 0
# Audit (lot K8) : evenements de connexion ; admin sans details (donnees personnelles)
eventsEnabled: true
eventsExpiration: 604800
enabledEventTypes: [LOGIN, LOGIN_ERROR, LOGOUT, CODE_TO_TOKEN, CODE_TO_TOKEN_ERROR, CLIENT_LOGIN, CLIENT_LOGIN_ERROR, REFRESH_TOKEN_ERROR]
adminEventsEnabled: true
adminEventsDetailsEnabled: false

# Scopes demandes par les clients : ils ajoutent l'audience donation-api au token (DS11 pilote)
clientScopes:
  - name: "donation:read"
    protocol: openid-connect
    attributes: { include.in.token.scope: "true", display.on.consent.screen: "false" }
    protocolMappers:
      - name: audience-donation-api
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        config: { included.client.audience: donation-api, access.token.claim: "true", id.token.claim: "false", introspection.token.claim: "true" }
  - name: "donation:write"
    protocol: openid-connect
    attributes: { include.in.token.scope: "true", display.on.consent.screen: "false" }
    protocolMappers:
      - name: audience-donation-api
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        config: { included.client.audience: donation-api, access.token.claim: "true", id.token.claim: "false", introspection.token.claim: "true" }

clients:
  # Resource server : porte les roles et sert d'audience, aucun flux
  - clientId: donation-api
    name: donation-api (resource server)
    protocol: openid-connect
    publicClient: false
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
  # BFF Next.js : authorization code + PKCE S256, confidentiel, back-channel logout
  - clientId: donation-web
    name: donation-web (Next.js BFF)
    protocol: openid-connect
    publicClient: false
    secret: $(env:DONATION_WEB_CLIENT_SECRET)
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    frontchannelLogout: false
    fullScopeAllowed: false
    redirectUris: ["$(env:DONATION_WEB_BASE_URL)/api/auth/callback/keycloak"]
    webOrigins: []
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: "$(env:DONATION_WEB_BASE_URL)/"
      backchannel.logout.url: "$(env:DONATION_WEB_BASE_URL)/api/auth/backchannel-logout"
      backchannel.logout.session.required: "true"
    defaultClientScopes: [basic, acr, profile, roles]
    optionalClientScopes: ["donation:read", "donation:write"]
  # Appels machine (futur inner-order-api) : client credentials, role agent, lecture seule
  - clientId: donation-service
    name: donation-service (client credentials)
    protocol: openid-connect
    publicClient: false
    secret: $(env:DONATION_SERVICE_CLIENT_SECRET)
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    fullScopeAllowed: false
    defaultClientScopes: [basic, roles]
    optionalClientScopes: ["donation:read"]
  # Tests Postman : actif en dev uniquement (DONATION_TESTS_CLIENT_ENABLED=false ailleurs)
  - clientId: donation-tests
    name: donation-tests (Postman, dev)
    enabled: $(env:DONATION_TESTS_CLIENT_ENABLED)
    protocol: openid-connect
    publicClient: false
    secret: $(env:DONATION_TESTS_CLIENT_SECRET)
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    fullScopeAllowed: false
    redirectUris: ["https://oauth.pstmn.io/v1/callback"]
    attributes:
      pkce.code.challenge.method: S256
    defaultClientScopes: [basic, acr, profile, roles]
    optionalClientScopes: ["donation:read", "donation:write"]

# Modele C (ADR 01/10) :
# - roles de CLIENT donation-api = PERMISSIONS, seules connues de l'API (resource_access.donation-api.roles), stables ;
# - roles de REALM composites = roles metier = LA MATRICE (gouvernance centrale : toute evolution = PR sur ce fichier).
roles:
  client:
    donation-api:
      - { name: "donor:create", description: Creer un donateur }
      - { name: "donor:read", description: Lire un donateur }
      - { name: "donor:list", description: Lister les donateurs }
      - { name: "donor:update", description: Modifier un donateur }
      - { name: "donor:delete", description: Supprimer un donateur (effacement RGPD) }
      - { name: "donation:create", description: Creer un don }
      - { name: "donation:read", description: Lire un don ou les dons d'un donateur }
      - { name: "donation:list", description: Lister les dons }
      - { name: "donation:update", description: Modifier un don (donnee financiere) }
      - { name: "donation:delete", description: Supprimer un don (donnee financiere) }
  realm:
    - name: donation-admin
      description: Administration complete des donateurs et des dons
      composite: true
      composites:
        client:
          donation-api: ["donor:create", "donor:read", "donor:list", "donor:update", "donor:delete",
                         "donation:create", "donation:read", "donation:list", "donation:update", "donation:delete"]
    - name: donation-agent
      description: Gestion courante, sans suppression ni modification des dons
      composite: true
      composites:
        client:
          donation-api: ["donor:create", "donor:read", "donor:list", "donor:update",
                         "donation:create", "donation:read", "donation:list"]
    - name: donation-donor
      description: Donateur - permissions ajoutees en K4 avec le controle du proprietaire (ABAC)

# Moindre privilege : permissions que chaque client peut porter dans ses tokens (fullScopeAllowed: false)
clientScopeMappings:
  donation-api:
    - client: donation-web
      roles: ["donor:create", "donor:read", "donor:list", "donor:update", "donor:delete",
              "donation:create", "donation:read", "donation:list", "donation:update", "donation:delete"]
    - client: donation-service
      roles: ["donor:read", "donor:list", "donation:read", "donation:list"]
    - client: donation-tests
      roles: ["donor:create", "donor:read", "donor:list", "donor:update", "donor:delete",
              "donation:create", "donation:read", "donation:list", "donation:update", "donation:delete"]

# Comptes de service : roles metier attribues aux clients en client credentials
users:
  - username: service-account-donation-service
    enabled: true
    serviceAccountClientId: donation-service
    realmRoles: [donation-agent]
  - username: service-account-donation-tests
    enabled: true
    serviceAccountClientId: donation-tests
    realmRoles: [donation-admin]
