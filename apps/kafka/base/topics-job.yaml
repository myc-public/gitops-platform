# Cree les topics apres chaque synchronisation Argo CD (hook PostSync) : Kafka est alors Healthy. Script idempotent.
# Un changement du script change le nom de sa ConfigMap (suffixe de hash) => OutOfSync => synchronisation => nouveau Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  labels:
    app.kubernetes.io/name: kafka-topics
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: events
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-topics
    spec:
      restartPolicy: Never
      containers:
        - name: kafka-topics
          image: docker.io/apache/kafka@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
          command: [sh, /scripts/create-topics.sh]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: scripts
          configMap:
            name: kafka-topics
