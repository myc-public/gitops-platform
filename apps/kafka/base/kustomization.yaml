apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - topics-job.yaml
  - networkpolicy.yaml
# Fichiers lus aussi par la pile locale (local/stack/kafka.pile.yaml) : aucune copie
configMapGenerator:
  - name: kafka-config
    envs:
      - kafka.env
  - name: kafka-topics
    files:
      - create-topics.sh
