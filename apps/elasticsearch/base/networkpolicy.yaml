# Isolation reseau : Kafka Connect (sink), donation-cqrs-api et le Job de configuration ; sortant non filtre.
# Sans effet sur le Sandbox OpenShift (dette 17) ; effectif sur un cluster maitrise.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: elasticsearch
  labels:
    app.kubernetes.io/part-of: events
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: kafka-connect } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: donation-cqrs-api } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: elasticsearch-config } }
      ports:
        - { protocol: TCP, port: 9200 }
