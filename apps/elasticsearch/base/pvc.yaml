apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-data
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/component: search
    app.kubernetes.io/part-of: events
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # Jamais supprimee par Argo CD ; reconstructible depuis Kafka (EDA-T10)
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  # Pas de storageClassName : classe par defaut du cluster => manifeste portable
  resources:
    requests:
      storage: 5Gi
