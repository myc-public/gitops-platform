apiVersion: apps/v1
kind: Deployment
metadata:
  name: donation-cqrs-api
  labels:
    app.kubernetes.io/name: donation-cqrs-api
    app.kubernetes.io/part-of: inner-apis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: donation-cqrs-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: donation-cqrs-api
    spec:
      containers:
        - name: donation-cqrs-api
          # Nom logique : newName/newTag poses par l'overlay (EDA8)
          image: donation-cqrs-api
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: donation-cqrs-api-config
          env:
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef: { name: elasticsearch-secret, key: ES_READ_PASSWORD }
          readinessProbe:
            httpGet: { path: /management/health/readiness, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /management/health/liveness, port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
