# Isolation reseau (O2) : seuls les flux de la pile locale (reseaux Docker) sont autorises ; sortant non filtre.
# Sans effet sur le Sandbox OpenShift (politique imposee allow-same-namespace, dette 17) ; effectif sur un cluster maitrise.
# Les sondes du kubelet ne sont pas concernees.
# BFF : APISIX externe (/bff/...) et Keycloak (back-channel logout, URL interne). Redis : uniquement le BFF.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-bff-customers
  labels:
    app.kubernetes.io/part-of: web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web-bff-customers
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: apisix-external } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: keycloak } }
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-bff-redis
  labels:
    app.kubernetes.io/part-of: web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web-bff-redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: web-bff-customers } }
      ports:
        - { protocol: TCP, port: 6379 }
