# APISIX externe (K5) : seul point d'entree Internet. Mode autonome : routes dans apisix.yaml (pas d'etcd,
# pas d'API d'administration). Image apisix-coraza (images/apisix-coraza) : WAF Coraza en plugin wasm.
deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml
apisix:
  node_listen:
    - 9080
  # Proxy de confiance (OpenShift : routeur, sur le reseau des pods) : seuls ses X-Forwarded-Proto / -Host / -Port
  # sont conserves (sinon APISIX les remplace : Keycloak verrait http). Defaut : aucun proxy (pile locale).
  trusted_addresses:
    - "${{TRUSTED_PROXY_CIDR:=127.0.0.1/32}}"
  # Sondes (OpenShift) : /status/ready = routes chargees ; port interne au pod, hors WAF (ni Service, ni port publie)
  status:
    ip: 0.0.0.0
    port: 7085
  ssl:
    enable: true
    listen:
      - port: 9443
wasm:
  plugins:
    - name: coraza-filter
      priority: 7999
      file: /usr/local/apisix/proxywasm/coraza-proxy-wasm.wasm
nginx_config:
  # Une VM wasm (WAF) par worker : 2 workers = ~285 Mo au lieu de ~890 Mo sur 8 coeurs (ADR 07/10).
  # Plus de trafic = plus d'instances, pas plus de workers.
  worker_processes: 2
  error_log_level: warn
  # Variables lues par apisix.yaml (${{...}} et $env://)
  envs:
    - PUBLIC_URL
    - KEYCLOAK_UPSTREAM
    - APISIX_INTERNAL_UPSTREAM
    - HSTS_MAX_AGE
    - TRUSTED_PROXY_CIDR
    - TLS_CERT
    - TLS_KEY
