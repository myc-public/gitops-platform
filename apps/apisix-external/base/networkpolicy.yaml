# Isolation reseau (O2) : seuls les flux de la pile locale (reseaux Docker) sont autorises ; sortant non filtre.
# Sans effet sur le Sandbox OpenShift (politique imposee allow-same-namespace, dette 17) ; effectif sur un cluster maitrise.
# Les sondes du kubelet ne sont pas concernees.
# Entree : uniquement le routeur OpenShift (namespace du groupe ingress), vers le port HTTP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apisix-external
  labels:
    app.kubernetes.io/part-of: inner-apis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: apisix-external
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { network.openshift.io/policy-group: ingress } }
      ports:
        - { protocol: TCP, port: 9080 }
