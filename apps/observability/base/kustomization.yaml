# Stack d'observabilite du pilote : grafana/otel-lgtm (Collector OTel + Prometheus + Loki + Tempo + Grafana)
# dans un seul pod. Les apps envoient traces / metriques / logs en OTLP sur le Service otel-lgtm:4318.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
