apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-lgtm
  labels:
    app.kubernetes.io/name: otel-lgtm
    app.kubernetes.io/part-of: observability
spec:
  replicas: 1
  # Recreate : volume RWO, jamais deux instances sur le meme /data
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-lgtm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-lgtm
        app.kubernetes.io/part-of: observability
    spec:
      containers:
        - name: otel-lgtm
          # Tag + digest epingle (index multi-arch) : mise a jour explicite
          image: docker.io/grafana/otel-lgtm:0.34.0@sha256:b966ea107831d526d9eb8fe4d2d86c9e5731392fad9dce8296bcf2072031f07c
          env:
            # Defaut de l'image = acces anonyme avec le role Admin : interdit derriere une Route publique
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
          envFrom:
            # GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD, cree hors Git
            - secretRef:
                name: observability-grafana-secret
          ports:
            - name: grafana
              containerPort: 3000
              protocol: TCP
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
          readinessProbe:
            # /tmp/ready est cree par run-all.sh quand toute la stack est demarree
            exec:
              command: [test, -f, /tmp/ready]
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: grafana }
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { cpu: "1", memory: 2Gi }
          volumeMounts:
            # Prometheus, Loki, Tempo, Grafana ecrivent sous /data
            - name: data
              mountPath: /data
            # Repertoire "shutdown marker" de Tempo, hors de /data : sans lui, Tempo plante sous UID aleatoire (verifie)
            - name: tempo-marker
              mountPath: /var/tempo
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: otel-lgtm-data
        - name: tempo-marker
          emptyDir: {}
        - name: tmp
          emptyDir: {}
