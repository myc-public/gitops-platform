  # Pre-vol CORS (sans token par nature) : transmis a l'API, qui applique sa politique CORS (fermee)
  - id: api-preflight-cors
    uri: /api/v1/*
    methods: ["OPTIONS"]
    priority: 5
    upstream:
      type: roundrobin
      nodes:
        "${{DONATION_API_UPSTREAM}}": 1

  # Repli : pas de token, ou emetteur inconnu -> 401 sans atteindre l'API
  - id: api-sans-emetteur-connu
    uri: /api/v1/*
    priority: 0
    plugins:
      mocking:
        response_status: 401
        content_type: application/json
        # Meme defi que l'API (RFC 6750)
        response_headers:
          WWW-Authenticate: Bearer
        response_example: '{"type":"/problem/security/unauthorized","title":"Unauthorized","status":401,"detail":"Token absent ou emetteur non reconnu"}'
#END
