apiVersion: v1
kind: Service
metadata:
  name: apisix-internal
  labels:
    app.kubernetes.io/name: apisix-internal
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: inner-apis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: apisix-internal
  # Port HTTP seul (le port de statut reste interne au pod). Pas de Route : joint uniquement par APISIX externe (O1-4).
  ports:
    - name: http
      port: 9080
      targetPort: http
      protocol: TCP
